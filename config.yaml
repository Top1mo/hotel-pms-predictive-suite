project:
  random_seed: 42
  # Fractions of booking-input groups, both relative to the full eligible population.
  # Row fractions are approximate because groups vary in size.
  test_size: 0.20
  val_size: 0.20

data:
  url: "https://raw.githubusercontent.com/afaq-ahmad/Hotel-booking-demand-Case-Study/master/H2.csv"
  raw_path: "data/raw/H2.csv"
  expected_rows: 79330
  expected_cols: 31

features:
  regression_target: "ADR"
  classification_target: "IsCanceled"
  # Authoritative feature lists are in src/preprocessing/pipelines.py.
